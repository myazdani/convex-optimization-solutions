[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convex-optimization-solutions"
version = "0.1.0"
description = "Reproducible Python computational companions to Boyd and Vandenberghe's Convex Optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4", "cvxpy>=1.5,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jsonschema>=4,<5"]

[project.scripts]
convex-solutions = "convex_solutions.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
convex_solutions = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["slow: full-size numerical experiment", "integration: runs a complete exercise"]
